<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑风山影箱 · 步态审片台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3ebda;color:#3e2d21;font:15px/1.55 system-ui}main{max-width:1230px;margin:22px auto;padding:0 20px}h1{font:600 30px "Songti SC",serif;margin:0}header,nav,.controls,.layers{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}nav,.controls,.layers{margin:12px 0}canvas{display:block;width:100%;background:#ead5af;border:1px solid #b59c76}button,select,a{font:inherit}button,select{color:#593d2e;border:1px solid #b49b76;background:#fff9ec;padding:5px 11px;border-radius:4px}button{cursor:pointer}button[aria-pressed=true]{background:#75412a;color:white;border-color:#75412a}a{color:#75412a}input{accent-color:#875532}#time{flex:1;min-width:100px}output{font-family:monospace}#description{color:#66523d}.layers{padding:10px 0;border-top:1px solid #c9b58f}label{white-space:nowrap}
</style><main><header><h1>黑风山影箱</h1></header><nav aria-label="角色"></nav><canvas width="1280" height="720"></canvas>
<div class="controls"><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><input aria-label="帧位置" id="time" type="range" min="0" max="191" value="0"><output></output><select aria-label="速度" id="speed"><option value="1">原速</option><option value=".5">半速</option><option value=".25">四分之一速</option></select><label><input type="checkbox" id="loop" checked>循环</label></div>
<div class="layers"><label><input type="checkbox" id="pins">显示铰点</label><label>单独看皮片 <select id="part"></select></label></div><p id="description"></p></main>
<script src="src/walker.js"></script><script src="actors/wukong/renderer.js"></script><script src="actors/tang/renderer.js"></script><script src="actors/jinchi/renderer.js"></script><script src="actors/guangmou/renderer.js"></script><script src="actors/monk/renderer.js"></script><script src="actors/bear/renderer.js"></script><script src="actors/warbear/renderer.js"></script><script src="actors/guanyin/renderer.js"></script><script src="src/stage.js"></script></html>
