<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大圣试棒 · 身段修订版</title><style>
:root{color-scheme:light;--paper:#f6f1e7;--ink:#302821;--red:#823829;--line:#cabeaa}
*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,"PingFang SC",sans-serif;margin:0}main{max-width:1300px;margin:0 auto;padding:22px 3.3vw 32px}header,.transport,.index{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:10px}h1{font:600 clamp(26px,3vw,40px) "Songti SC",serif;letter-spacing:.12em;margin:0}header div{display:flex;align-items:baseline;gap:20px}header span{color:#836d57}a{color:var(--red);text-underline-offset:4px}canvas{background:#382b24;width:100%;height:auto;display:block}.transport{padding:12px 0 15px;border-bottom:1px solid var(--line)}button,select{font:inherit;color:var(--ink);border:1px solid #c6b7a0;background:#faf7ee;padding:5px 10px;border-radius:3px;cursor:pointer}button[aria-pressed=true],#play{background:var(--red);color:#fff3de;border-color:var(--red)}.index{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:13px 0}.index button{text-align:left;display:flex;gap:8px;align-items:center}.index small{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}input{accent-color:var(--red)}#time{flex:1;min-width:120px}output{font:13px ui-monospace,monospace}label{white-space:nowrap}@media(max-width:850px){.index{grid-template-columns:repeat(3,1fr)}header div{gap:9px}}@media(max-width:500px){.index{grid-template-columns:repeat(2,1fr)}main{padding:10px}.transport{gap:6px}}
</style></head><body><main><header><div><h1>大圣试棒</h1><span>身段修订版</span></div><div></div></header><canvas id="film" width="1280" height="720" aria-label="皮影舞台"></canvas><div class="transport"><button id="play">播放</button><button id="prev" title="上一帧">−1 帧</button><button id="next" title="下一帧">+1 帧</button><input id="time" type="range" min="0" max="95" value="0" aria-label="本式时间"><output id="clock"></output><select id="rate" aria-label="播放速度"><option value="1">原速</option><option value=".5">半速</option><option value=".25">四分之一速</option></select><label><input type="checkbox" id="loop">循环本式</label><label><input type="checkbox" id="pins">关节（近红／远蓝）</label></div><nav class="index" aria-label="选式"></nav><audio preload="auto"></audio></main>
<script src="production/monkey.js"></script><script src="production/moves.js"></script><script src="production/props.js"></script><script src="production/stage.js"></script><script src="production/player.js"></script></body></html>
